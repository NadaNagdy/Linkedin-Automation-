name: Health Trends Auto-Post
on:
  workflow_dispatch: 

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install facebook-sdk openai requests beautifulsoup4 python-dotenv lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
      - name: Run Automation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }} 
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }} 
        run: |
          echo "Debug: Token length is ${#LINKEDIN_TOKEN}"
          echo "Debug: URN length is ${#LINKEDIN_PERSON_URN}"
          # Run the main automation bot
          python run_bot.py
