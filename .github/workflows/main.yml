name: Health Trends Auto-Post
on:
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post Type (research, opportunity, conference)'
        required: false
        default: 'research'
  schedule:
    - cron: '0 7 * * *'  # 7:00 AM UTC (10:00 AM Cairo Time) - High views for Research
    - cron: '15 9 * * *'  # 9:15 AM UTC (12:15 PM Cairo Time) - Tools & Databases
    - cron: '15 13 * * *' # 1:15 PM UTC (4:15 PM Cairo Time) - High views for Opportunities
    - cron: '15 17 * * *' # 5:15 PM UTC (8:15 PM Cairo Time) - High views for Conferences

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install facebook-sdk openai requests beautifulsoup4 python-dotenv lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
      - name: Run Automation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }} 
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }} 
        run: |
          echo "Debug: Token length is ${#LINKEDIN_TOKEN}"
          
          # GitHub Actions runs in UTC. 
          HOUR=$(date +%H)
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ github.event.inputs.post_type }}"
            echo "Manual trigger for type: $TYPE"
            python run_bot.py --type=$TYPE
          elif [ "$HOUR" = "07" ] || [ "$HOUR" = "7" ]; then
            echo "Scheduled trigger for Research (10 AM Local time)"
            python run_bot.py --type=research
          elif [ "$HOUR" = "09" ] || [ "$HOUR" = "9" ]; then
            echo "Scheduled trigger for Tool (12:15 PM Local time)"
            python run_bot.py --type=tool
          elif [ "$HOUR" = "17" ]; then
            echo "Scheduled trigger for Conference (8 PM Local time)"
            python run_bot.py --type=conference
          else
            echo "Scheduled trigger for Opportunity (4 PM Local time)"
            python run_bot.py --type=opportunity
          fi
