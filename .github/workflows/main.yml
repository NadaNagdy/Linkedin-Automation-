name: Health Trends Auto-Post
on:
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post Type (research or opportunity)'
        required: false
        default: 'research'
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC (9:00 AM Cairo Time) - High views for Research
    - cron: '0 13 * * *' # 1:00 PM UTC (4:00 PM Cairo Time) - High views for Opportunities

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install facebook-sdk openai requests beautifulsoup4 python-dotenv lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
      - name: Run Automation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }} 
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }} 
        run: |
          echo "Debug: Token length is ${#LINKEDIN_TOKEN}"
          
          # GitHub Actions runs in UTC. 
          HOUR=$(date +%H)
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ github.event.inputs.post_type }}"
            echo "Manual trigger for type: $TYPE"
            python run_bot.py --type=$TYPE
          elif [ "$HOUR" = "06" ] || [ "$HOUR" = "6" ]; then
            echo "Scheduled trigger for Research (9 AM Local time)"
            python run_bot.py --type=research
          else
            echo "Scheduled trigger for Opportunity (4 PM Local time)"
            python run_bot.py --type=opportunity
          fi
