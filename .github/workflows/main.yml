name: Health Trends Auto-Post
on:
  schedule:
    - cron: '0 6 * * *' # Run daily at 6:00 AM UTC (8:00 AM Cairo)
  workflow_dispatch: # للتشغيل اليدوي للتجربة

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Forced installation of facebook-sdk to ensure it's there
          pip install facebook-sdk openai requests
          # If you have other specific libs in requirements.txt, keep this:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
      - name: Run Automation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }} 
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          # Added Facebook secret for the script to use
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }} 
        run: |
          # Run the main automation bot
          python run_bot.py
