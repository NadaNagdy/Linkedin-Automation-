name: Auto-Post Tool
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install facebook-sdk openai requests beautifulsoup4 python-dotenv lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
      - name: Run Automation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          echo "Running tool post..."
          python run_bot.py --type=tool
      
      - name: Commit history.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "Auto-update history.json [skip ci]" || true
          git push || true
