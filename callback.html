<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Authentication</title>
</head>
<body>
    <h2>Authenticating...</h2>
    <p id="status">Please wait while we complete the authentication.</p>

    <script>
        // استخرج الـ authorization code من URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('status').textContent = 'Error: ' + error;
        } else if (code) {
            // احفظ الـ code في localStorage
            localStorage.setItem('linkedin_auth_code', code);
            document.getElementById('status').textContent = 'Authentication successful! Redirecting...';
            
            // ارجع للصفحة الرئيسية
            setTimeout(() => {
                window.location.href = './index.html';
            }, 1000);
        } else {
            document.getElementById('status').textContent = 'No authorization code received.';
        }
    </script>
</body>
</html>
